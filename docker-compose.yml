services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fuel_planner}
      POSTGRES_USER: ${POSTGRES_USER:-fuel_planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fuel_planner}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuel_planner -d fuel_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-to-a-long-random-string}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      POSTGRES_DB: ${POSTGRES_DB:-fuel_planner}
      POSTGRES_USER: ${POSTGRES_USER:-fuel_planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fuel_planner}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
